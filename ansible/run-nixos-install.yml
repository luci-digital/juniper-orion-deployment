---
# Run NixOS Installation Inside VM
# This playbook waits for the VM to boot, then runs the installation script

- name: Run NixOS Installation Inside VM
  hosts: r730_stargate
  become: yes
  vars:
    vm_name: "nixos-router"
    install_script: "/var/opt/juniper-orion/scripts/install.sh"
    config_server: "http://192.168.1.175:8000"
    callback_server: "http://192.168.1.175:9999"

  tasks:
    - name: Wait for VM to boot (30 seconds)
      wait_for:
        timeout: 30

    - name: Check VM is running
      shell: virsh list | grep {{ vm_name }} | grep running
      register: vm_status

    - name: Display VM status
      debug:
        msg: "VM Status: {{ vm_status.stdout }}"

    - name: Get VM IP address (may take a moment)
      shell: |
        for i in {1..10}; do
          IP=$(virsh domifaddr {{ vm_name }} | grep -oP '192\.168\.\d+\.\d+' | head -1)
          if [ ! -z "$IP" ]; then
            echo "$IP"
            exit 0
          fi
          sleep 3
        done
        echo "NO_IP"
      register: vm_ip

    - name: Display VM network info
      debug:
        msg: "VM IP: {{ vm_ip.stdout }}"

    - name: Create installation wrapper script
      copy:
        content: |
          #!/bin/bash
          # Automated NixOS Installation Wrapper
          # This runs on the openEuler host and executes installation inside VM

          set -euo pipefail

          VM_NAME="{{ vm_name }}"

          echo "=========================================="
          echo "NixOS VM Installation Automation"
          echo "=========================================="
          echo ""

          # Check if VM is running
          if ! virsh list | grep -q "$VM_NAME.*running"; then
            echo "Error: VM $VM_NAME is not running!"
            exit 1
          fi

          echo "VM is running. Waiting 30 seconds for boot..."
          sleep 30

          # Method 1: Try to copy and execute script via virsh
          echo ""
          echo "Attempting to execute installation..."
          echo ""

          # Since we can't easily interact with virsh console programmatically,
          # we'll create a cloud-init or kickstart-style automated install

          # For now, display instructions
          echo "=========================================="
          echo "MANUAL INSTALLATION REQUIRED"
          echo "=========================================="
          echo ""
          echo "To complete installation:"
          echo "1. Connect to VM console:"
          echo "   virsh console {{ vm_name }}"
          echo ""
          echo "2. Once at NixOS installer prompt, run:"
          echo "   curl {{ config_server }}/nixos_vm_install.sh | bash"
          echo ""
          echo "3. Or manually run the script:"
          echo "   {{ install_script }}"
          echo ""
          echo "The installation will:"
          echo "- Partition /dev/vda"
          echo "- Install NixOS with JuniperOrionOS config"
          echo "- Download router configurations"
          echo "- Take approximately 15-20 minutes"
          echo ""
          echo "=========================================="

        dest: /var/opt/juniper-orion/scripts/install_wrapper.sh
        mode: '0755'

    - name: Run installation wrapper
      shell: bash /var/opt/juniper-orion/scripts/install_wrapper.sh
      register: install_output

    - name: Display installation output
      debug:
        msg: "{{ install_output.stdout_lines }}"

    - name: Display next steps
      debug:
        msg: |

          ==========================================
          🌲 JuniperOrionOS VM Ready for Installation
          ==========================================

          VM is running and ready for NixOS installation.

          NEXT STEPS:

          1. Access VM via VNC:
             - VNC Server: 192.168.1.141:5900
             - Use any VNC client (TigerVNC, RealVNC, etc.)

          2. OR access via virsh console:
             ssh root@192.168.1.141
             virsh console {{ vm_name }}
             (Press Enter to activate console)

          3. At the NixOS installer prompt, run:
             curl {{ config_server }}/nixos_vm_install.sh | bash

          4. Installation takes ~15 minutes

          5. After reboot, configure router:
             bash /root/juniper-orion/post_install.sh

          ==========================================
          नेटवर्क सत्यम् (Network is Truth) - 639Hz
          ==========================================
