{
    "comment": "R730 ORION Jool NAT64 - DISABLED BY DEFAULT",
    "comment2": ".ownid zone is IPv6-only, no Web2 access",

    "instance": "ownid-nat64",
    "framework": "netfilter",

    "global": {
        "pool6": "64:ff9b::/96",
        "manually-enabled": false,
        "address-dependent-filtering": true,
        "drop-icmpv6-info": false,
        "drop-externally-initiated-tcp": true,
        "logging-bib": true,
        "logging-session": true,
        "maximum-simultaneous-opens": 10,
        "source-icmpv6-errors-better": true
    },

    "pool4": [
        {
            "comment": "TCP translations via WAN1",
            "protocol": "TCP",
            "prefix": "206.75.1.126/32",
            "port range": "61001-65535"
        },
        {
            "comment": "UDP translations via WAN1",
            "protocol": "UDP",
            "prefix": "206.75.1.126/32",
            "port range": "61001-65535"
        },
        {
            "comment": "ICMP translations",
            "protocol": "ICMP",
            "prefix": "206.75.1.126/32"
        }
    ],

    "eamt": [],

    "denylist4": [
        {"comment": "Block RFC1918 private", "prefix": "10.0.0.0/8"},
        {"comment": "Block RFC1918 private", "prefix": "172.16.0.0/12"},
        {"comment": "Block RFC1918 private", "prefix": "192.168.0.0/16"},
        {"comment": "Block localhost", "prefix": "127.0.0.0/8"},
        {"comment": "Block link-local", "prefix": "169.254.0.0/16"}
    ]
}
