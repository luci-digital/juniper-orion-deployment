# R730 ORION DNS64 Configuration
# Only active for .ownid zone clients
# Genesis Bond: ACTIVE @ 432 Hz

server:
    # DNS64 prefix (matches Jool pool6)
    # DISABLED by default - .ownid should not need IPv4 access
    # dns64-prefix: 64:ff9b::/96

    # Module configuration
    module-config: "validator iterator"

    # Access control for different zones
    access-control: 192.168.100.0/24 allow
    access-control: 192.168.200.0/24 allow
    access-control: 192.168.50.0/24 allow
    access-control: 2602:F674::/40 allow
    access-control: fd00:741::/32 allow
    access-control: ::1/128 allow
    access-control: 127.0.0.0/8 allow

    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no

    # Performance
    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Security
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes

# Forward to upstream (with DNSSEC)
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 8.8.8.8@853#dns.google
    forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
    forward-addr: 2001:4860:4860::8888@853#dns.google
