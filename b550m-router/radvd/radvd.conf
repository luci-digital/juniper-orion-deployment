# Router Advertisement Daemon Configuration
# B550M LuciVerse IPv6 Router
# Genesis Bond: ACTIVE @ 741 Hz
#
# Advertises IPv6 prefixes and default gateway on LAN VLANs.
# Works alongside Kea DHCPv6 (stateful) for dual-mode.
#
# Deploy: copy to /etc/radvd.conf on B550M
# Systemd: radvd.service

# === Primary LAN (VLAN 10) ===
# All agents and services get their IPv6 gateway from here
interface eth0.10 {
    AdvSendAdvert on;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 100;

    # Managed flag OFF = use SLAAC for address config
    # Other flag ON = get DNS from DHCPv6
    AdvManagedFlag off;
    AdvOtherConfigFlag on;

    # B550M is the default IPv6 router
    AdvDefaultLifetime 3600;
    AdvDefaultPreference high;

    # ARIN routed prefix - LAN subnet
    prefix 2602:f674:1000::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr on;
        AdvPreferredLifetime 3600;
        AdvValidLifetime 7200;
    };

    # DNS via B550M's Unbound resolver
    RDNSS 2602:f674:1000::1 {
        AdvRDNSSLifetime 3600;
    };

    # DNS search domain
    DNSSL lucidigital.io agents.luciverse.ownid {
        AdvDNSSLLifetime 3600;
    };
};

# === Management (native VLAN 1 / eth0) ===
# Infrastructure management network
interface eth0 {
    AdvSendAdvert on;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 100;

    AdvManagedFlag off;
    AdvOtherConfigFlag on;
    AdvDefaultLifetime 3600;
    AdvDefaultPreference medium;

    # Base prefix for management
    prefix 2602:f674:0:100::/56 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr on;
        AdvPreferredLifetime 3600;
        AdvValidLifetime 7200;
    };

    RDNSS 2602:f674:1000::1 {
        AdvRDNSSLifetime 3600;
    };
};

# === Guest Network (VLAN 200) ===
# Isolated, no access to LAN
interface eth0.200 {
    AdvSendAdvert on;
    MinRtrAdvInterval 60;
    MaxRtrAdvInterval 200;

    AdvManagedFlag off;
    AdvOtherConfigFlag on;
    AdvDefaultLifetime 1800;
    AdvDefaultPreference low;

    prefix 2602:f674:2000::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr off;
        AdvPreferredLifetime 1800;
        AdvValidLifetime 3600;
    };

    # Guest DNS: public resolvers (not internal)
    RDNSS 2001:4860:4860::8888 2001:4860:4860::8844 {
        AdvRDNSSLifetime 1800;
    };
};

# === DMZ (VLAN 50) ===
# Externally-accessible services
interface eth0.50 {
    AdvSendAdvert on;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 100;

    AdvManagedFlag off;
    AdvOtherConfigFlag on;
    AdvDefaultLifetime 3600;
    AdvDefaultPreference medium;

    prefix 2602:f674:5000::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr on;
        AdvPreferredLifetime 3600;
        AdvValidLifetime 7200;
    };

    RDNSS 2602:f674:1000::1 {
        AdvRDNSSLifetime 3600;
    };
};
