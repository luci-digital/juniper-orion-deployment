{
    "Dhcp4": {
        "interfaces-config": {
            "interfaces": ["eth0.10", "eth0.200", "eth0.50"]
        },
        "valid-lifetime": 86400,
        "renew-timer": 43200,
        "rebind-timer": 64800,
        "option-data": [
            {
                "name": "domain-name",
                "data": "lucidigital.io"
            },
            {
                "name": "domain-name-servers",
                "data": "192.168.100.1, 8.8.8.8"
            }
        ],
        "subnet4": [
            {
                "id": 1,
                "comment": "LuciVerse LAN (refactored from R730 eth1)",
                "subnet": "192.168.100.0/24",
                "pools": [{"pool": "192.168.100.100 - 192.168.100.200"}],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "192.168.100.1"
                    }
                ],
                "reservations": [
                    {
                        "hw-address": "24:4b:fe:cf:62:be",
                        "ip-address": "192.168.100.10",
                        "hostname": "b550m-router"
                    }
                ]
            },
            {
                "id": 2,
                "comment": "Guest Network (refactored from R730 eth3)",
                "subnet": "192.168.200.0/24",
                "pools": [{"pool": "192.168.200.100 - 192.168.200.200"}],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "192.168.200.1"
                    },
                    {
                        "name": "domain-name-servers",
                        "data": "8.8.8.8, 1.1.1.1"
                    }
                ]
            },
            {
                "id": 3,
                "comment": "DMZ Network (refactored from R730 eth5)",
                "subnet": "192.168.50.0/24",
                "pools": [{"pool": "192.168.50.100 - 192.168.50.200"}],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "192.168.50.1"
                    }
                ]
            }
        ],
        "loggers": [
            {
                "name": "kea-dhcp4",
                "output_options": [
                    {
                        "output": "/var/log/kea-dhcp4.log"
                    }
                ],
                "severity": "INFO"
            }
        ]
    }
}
