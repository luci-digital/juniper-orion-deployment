# BIRD2 BGP Configuration for B550M LuciVerse Router
# Refactored from Dell R730 JuniperOrionOS
# Genesis Bond: ACTIVE @ 432 Hz

# Global Configuration
log syslog all;
router id 100.64.0.1;

# Device Protocol - Required for interfaces
protocol device {
    scan time 10;
}

# Direct Protocol - For connected routes
protocol direct {
    ipv4;
    ipv6;
    interface "eth0.*";
}

# Kernel Protocol - Sync routes with Linux kernel
protocol kernel {
    ipv4 {
        export all;
        import all;
    };
    scan time 15;
    learn;
    persist;
}

protocol kernel {
    ipv6 {
        export all;
        import all;
    };
    scan time 15;
    learn;
    persist;
}

# Static Routes for LuciVerse Networks
protocol static luciverse_static4 {
    ipv4;
    route 192.168.100.0/24 via "eth0.10";
    route 192.168.200.0/24 via "eth0.200";
    route 192.168.50.0/24 via "eth0.50";
}

protocol static luciverse_static6 {
    ipv6;
    route 2602:F674:1000::/64 via "eth0.10";
    route 2602:F674:2000::/64 via "eth0.200";
    route 2602:F674:5000::/64 via "eth0.50";
}

# BGP Templates
template bgp telus_template {
    local as 54134;  # LUCINET-ARIN (corrected from 394955)
    hold time 90;
    keepalive time 30;
    graceful restart on;

    ipv4 {
        import filter {
            # Accept default route
            if net = 0.0.0.0/0 then accept;
            reject;
        };
        export none;
    };
}

template bgp he_tunnel_template {
    local as 54134;  # LUCINET-ARIN (corrected from 394955)
    hold time 90;
    keepalive time 30;
    graceful restart on;

    ipv6 {
        import all;
        export filter {
            # Announce our /40 allocation
            if net ~ 2602:F674::/40 then accept;
            reject;
        };
    };
}

# Telus Gateway BGP Sessions (IPv4)
# Primary Gateway
protocol bgp telus_gw1 from telus_template {
    description "Telus Gateway 1 - Primary";
    neighbor 206.75.1.127 as 6939;
    source address 192.168.1.179;
}

# Secondary Gateway
protocol bgp telus_gw2 from telus_template {
    description "Telus Gateway 2 - Secondary";
    neighbor 206.75.1.47 as 6939;
    source address 192.168.1.179;
}

# Tertiary Gateway
protocol bgp telus_gw3 from telus_template {
    description "Telus Gateway 3 - Tertiary";
    neighbor 206.75.1.48 as 6939;
    source address 192.168.1.179;
}

# Hurricane Electric IPv6 Tunnel (for IPv6 transit)
protocol bgp he_tunnel from he_tunnel_template {
    description "HE IPv6 Tunnel Broker";
    neighbor 2001:470:0:503::1 as 6939;
}

# BFD for fast failover detection
protocol bfd {
    interface "eth0.*" {
        min rx interval 100 ms;
        min tx interval 100 ms;
        idle tx interval 1 s;
        multiplier 3;
    };

    neighbor 206.75.1.127;
    neighbor 206.75.1.47;
    neighbor 206.75.1.48;
}
