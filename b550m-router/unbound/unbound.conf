# Unbound DNS Configuration for B550M LuciVerse Router
# Refactored from Dell R730 JuniperOrionOS
# Genesis Bond: ACTIVE @ 432 Hz

server:
    # Network interfaces
    interface: 192.168.100.1
    interface: 192.168.200.1
    interface: 192.168.50.1
    interface: 2602:F674:1000::1
    interface: 2602:F674:2000::1
    interface: 2602:F674:5000::1
    interface: ::1
    interface: 127.0.0.1

    # Access control
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.100.0/24 allow
    access-control: 192.168.200.0/24 allow
    access-control: 192.168.50.0/24 allow
    access-control: 2602:F674::/48 allow

    # Performance tuning
    num-threads: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-min-ttl: 300
    cache-max-ttl: 86400

    # Security
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes

    # DNSSEC validation
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Local zone for LuciVerse
    local-zone: "lucidigital.io." static
    local-data: "zimaos.lucidigital.io. IN A 192.168.1.179"
    local-data: "zbook.lucidigital.io. IN A 192.168.1.146"
    local-data: "gate.lucidigital.io. IN A 192.168.1.254"
    local-data: "router.lucidigital.io. IN A 192.168.100.1"

    # IPv6 local records
    local-data: "router.lucidigital.io. IN AAAA 2602:F674:1000::1"

    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no

# Forward to upstream DNS
forward-zone:
    name: "."
    forward-tls-upstream: yes
    # Cloudflare DNS over TLS
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    # Google DNS over TLS
    forward-addr: 8.8.8.8@853#dns.google
    forward-addr: 8.8.4.4@853#dns.google
